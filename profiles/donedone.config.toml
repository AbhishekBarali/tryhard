# Done Done profile for Codex (optional).
#
# Copy this file to ~/.codex/donedone.config.toml and start Codex with
#
#   codex --profile donedone
#
# Codex layers it on top of ~/.codex/config.toml, so only the settings below
# change. Remove any line you don't want.

# Codex's model catalog starts GPT-6.2 Astra and Sol at low reasoning effort.
# Low effort does poorly on multi-step work, so this profile uses high. Switch
# to "xhigh" for hard investigations, or to "ultra" (where your account offers
# it) for large work that splits into parallel parts, since ultra also lets
# Codex decide when to use subagents.
model_reasoning_effort = "high"

# Plan mode has its own effort setting.
plan_mode_reasoning_effort = "high"

# The catalog also starts these models at low verbosity. Medium leaves room in
# the final report for how the work was checked and what is still open. Delete
# this line if replies get longer than you like.
model_verbosity = "medium"

[agents]
# Subagents get the same effort unless a spawn call picks one.
default_subagent_reasoning_effort = "high"
