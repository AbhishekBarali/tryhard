<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Tryhard</title>
  <desc id="desc">Tryhard wordmark. Tagline: Tryhard mode for GPT-6.2. A game-style settings panel shows the effort meter pinned at MAX and the TRYHARD MODE switch turned on.</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 2; }
    .panel { fill: #0d1117; stroke: #30363d; stroke-width: 2; }
    .rule { fill: none; stroke: #30363d; stroke-width: 2; }
    .ink { fill: #e6edf3; }
    .muted { fill: #9198a1; }
    .hot { fill: #ff6b2c; }
    .on-hot { fill: #1a0d06; }
    .knob { fill: #ffffff; }
  </style>

  <rect class="card" x="1" y="1" width="1278" height="398" rx="24"/>

  <!-- Wordmark -->
  <g transform="translate(92 200) skewX(-9)">
    <text class="sans ink" x="0" y="0" font-size="132" font-weight="900" letter-spacing="-4">Try<tspan class="hot">hard</tspan></text>
  </g>

  <!-- Tagline -->
  <text class="sans ink" x="88" y="280" font-size="38" font-weight="700">Tryhard mode for GPT-6.2.</text>
  <text class="mono muted" x="88" y="326" font-size="23">A Codex plugin for Astra and Sol</text>

  <!-- Game-style settings panel -->
  <rect class="panel" x="760" y="112" width="432" height="208" rx="20"/>

  <!-- Row 1: effort meter pinned at max -->
  <text class="sans ink" x="792" y="174" font-size="24" font-weight="800" letter-spacing="1.5">EFFORT</text>
  <g class="hot" transform="translate(922 182) skewX(-14)">
    <rect x="0" y="-16" width="16" height="16" rx="3"/>
    <rect x="22" y="-20" width="16" height="20" rx="3"/>
    <rect x="44" y="-24" width="16" height="24" rx="3"/>
    <rect x="66" y="-28" width="16" height="28" rx="3"/>
    <rect x="88" y="-32" width="16" height="32" rx="3"/>
    <rect x="110" y="-36" width="16" height="36" rx="3"/>
    <rect x="132" y="-40" width="16" height="40" rx="3"/>
  </g>
  <text class="sans hot" x="1102" y="174" font-size="24" font-weight="800" letter-spacing="1">MAX</text>

  <path class="rule" d="M788 216H1164"/>

  <!-- Row 2: TRYHARD MODE switch, on -->
  <text class="sans ink" x="792" y="277" font-size="24" font-weight="800" letter-spacing="1.5">TRYHARD MODE</text>
  <rect class="hot" x="1062" y="242" width="102" height="52" rx="26"/>
  <text class="sans on-hot" x="1078" y="276" font-size="20" font-weight="800" letter-spacing="1">ON</text>
  <circle class="knob" cx="1138" cy="268" r="20"/>
</svg>
