<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="965" viewBox="0 0 1280 965" role="img" aria-labelledby="title desc">
  <title id="title">Without Tryhard and with Tryhard</title>
  <desc id="desc">Three habits of a coding agent, each shown as the message it sends without Tryhard and with Tryhard. Stops at a list: without, “Found 3 bugs. Want me to fix them?”; with, “Fixed all 3 bugs and checked each one. All 24 tests pass.” Asks about its own files: without, “Blocked: should the reviewer write to 24_g521.mp4 or 24_p11.mp4?”; with, “Used 24_g521.mp4, the newer clip, and kept going.” Explains in riddles: without, “Root cause is pnpm’s per-tree link phase falling back to copy across mounts (EXDEV)…”; with, “It’s slow because this machine’s SSD is slow.”</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .page { fill: #0d1117; }
    .ink { fill: #e6edf3; }
    .muted { fill: #9198a1; }
    .hot { fill: #ff6b2c; }
    .tick { fill: none; stroke: #1a0d06; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .b-off { fill: #161b22; stroke: #30363d; stroke-width: 2; }
    .b-on { fill: #21160f; stroke: #ff6b2c; stroke-width: 2; }
    .r-off { fill: #30363d; }
    .t-off { fill: #9198a1; }
    .t-on { fill: #e6edf3; }
  </style>

  <rect class="page" width="1280" height="965" rx="16"/>

  <text class="sans muted" x="42" y="72" font-size="36" font-weight="800">Without Tryhard</text>
  <g><circle class="hot" cx="670" cy="59" r="18"/><path class="tick" d="M662.2 59.6l5.4 5.4l10.8 -12"/></g>
  <text class="sans hot" x="700" y="72" font-size="36" font-weight="800">With Tryhard</text>
  <rect class="r-off" x="40" y="94" width="588" height="3" rx="1.5"/>
  <rect class="hot" x="652" y="94" width="588" height="3" rx="1.5"/>

  <!-- Stops at a list -->
  <text class="sans ink" x="42" y="162" font-size="30" font-weight="700">Stops at a list</text>
  <path class="b-off" d="M62 184H606a22 22 0 0 1 22 22V295a22 22 0 0 1 -22 22H46a6 6 0 0 1 -6 -6V206a22 22 0 0 1 22 -22Z"/>
  <text class="sans t-off" x="72" y="239" font-size="32">Found 3 bugs.</text>
  <text class="sans t-off" x="72" y="285" font-size="32">Want me to fix them?</text>
  <path class="b-on" d="M674 184H1218a22 22 0 0 1 22 22V295a22 22 0 0 1 -22 22H658a6 6 0 0 1 -6 -6V206a22 22 0 0 1 22 -22Z"/>
  <text class="sans t-on" x="684" y="239" font-size="32">Fixed all 3 bugs and checked</text>
  <text class="sans t-on" x="684" y="285" font-size="32">each one. All 24 tests pass.</text>
  <g><circle class="hot" cx="1199" cy="250.5" r="15"/><path class="tick" d="M1192.5 251l4.5 4.5l9 -10"/></g>

  <!-- Asks about its own files -->
  <text class="sans ink" x="42" y="391" font-size="30" font-weight="700">Asks about its own files</text>
  <path class="b-off" d="M62 413H606a22 22 0 0 1 22 22V570a22 22 0 0 1 -22 22H46a6 6 0 0 1 -6 -6V435a22 22 0 0 1 22 -22Z"/>
  <text class="sans t-off" x="72" y="468" font-size="32">Blocked: should the reviewer</text>
  <text class="sans t-off" x="72" y="514" font-size="32">write to <tspan class="mono" font-size="30">24_g521.mp4</tspan> or</text>
  <text class="sans t-off" x="72" y="560" font-size="32"><tspan class="mono" font-size="30">24_p11.mp4</tspan>?</text>
  <path class="b-on" d="M674 413H1218a22 22 0 0 1 22 22V570a22 22 0 0 1 -22 22H658a6 6 0 0 1 -6 -6V435a22 22 0 0 1 22 -22Z"/>
  <text class="sans t-on" x="684" y="491" font-size="32">Used <tspan class="mono" font-size="30">24_g521.mp4</tspan>,</text>
  <text class="sans t-on" x="684" y="537" font-size="32">the newer clip, and kept going.</text>
  <g><circle class="hot" cx="1199" cy="502.5" r="15"/><path class="tick" d="M1192.5 503l4.5 4.5l9 -10"/></g>

  <!-- Explains in riddles -->
  <text class="sans ink" x="42" y="666" font-size="30" font-weight="700">Explains in riddles</text>
  <path class="b-off" d="M62 688H606a22 22 0 0 1 22 22V845a22 22 0 0 1 -22 22H46a6 6 0 0 1 -6 -6V710a22 22 0 0 1 22 -22Z"/>
  <text class="sans t-off" x="72" y="743" font-size="32">Root cause is pnpm’s per-tree</text>
  <text class="sans t-off" x="72" y="789" font-size="32">link phase falling back to copy</text>
  <text class="sans t-off" x="72" y="835" font-size="32">across mounts (EXDEV)…</text>
  <path class="b-on" d="M674 688H1218a22 22 0 0 1 22 22V845a22 22 0 0 1 -22 22H658a6 6 0 0 1 -6 -6V710a22 22 0 0 1 22 -22Z"/>
  <text class="sans t-on" x="684" y="766" font-size="32">It’s slow because</text>
  <text class="sans t-on" x="684" y="812" font-size="32">this machine’s SSD is slow.</text>
  <g><circle class="hot" cx="1199" cy="777.5" r="15"/><path class="tick" d="M1192.5 778l4.5 4.5l9 -10"/></g>

  <text class="sans muted" x="640" y="925" font-size="26" text-anchor="middle">Example messages, for illustration</text>
</svg>
