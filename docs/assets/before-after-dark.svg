<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1194" viewBox="0 0 1280 1194" role="img" aria-labelledby="title desc">
  <title id="title">Without Tryhard and with Tryhard</title>
  <desc id="desc">Four ways a coding agent leaves work unfinished, each shown as the message it sends without Tryhard and with Tryhard. Stops at a list: without, “Found 3 bugs. Want me to fix them?”; with, “Fixed all 3 bugs and checked each one. All 24 tests pass.” Stops halfway: without, “Done with the first 2 screens. Shall I continue with the rest?”; with, “Built all 5 screens and clicked through each one.” Does the bare minimum: without, “Added the --limit flag.”; with, “Added --limit and refused negative numbers. Updated the help and README. Tested 0, 3, 50.” Ships the first draft: without, “Here’s your landing page.”; with, “Built it, reviewed it like a designer, and fixed the weakest parts in 2 more rounds.”</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
    .page { fill: #0d1117; }
    .ink { fill: #e6edf3; }
    .muted { fill: #9198a1; }
    .hot { fill: #ff6b2c; }
    .tick { fill: none; stroke: #1a0d06; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .b-off { fill: #161b22; stroke: #30363d; stroke-width: 2; }
    .b-on { fill: #21160f; stroke: #ff6b2c; stroke-width: 2; }
    .r-off { fill: #30363d; }
    .t-off { fill: #9198a1; }
    .t-on { fill: #e6edf3; }
  </style>

  <rect class="page" width="1280" height="1194" rx="16"/>

  <text class="sans muted" x="42" y="72" font-size="36" font-weight="800">Without Tryhard</text>
  <g><circle class="hot" cx="670" cy="59" r="18"/><path class="tick" d="M662.2 59.6l5.4 5.4l10.8 -12"/></g>
  <text class="sans hot" x="700" y="72" font-size="36" font-weight="800">With Tryhard</text>
  <rect class="r-off" x="40" y="94" width="588" height="3" rx="1.5"/>
  <rect class="hot" x="652" y="94" width="588" height="3" rx="1.5"/>

  <!-- Stops at a list -->
  <text class="sans ink" x="42" y="162" font-size="30" font-weight="700">Stops at a list</text>
  <path class="b-off" d="M62 184H606a22 22 0 0 1 22 22V295a22 22 0 0 1 -22 22H46a6 6 0 0 1 -6 -6V206a22 22 0 0 1 22 -22Z"/>
  <text class="sans t-off" x="72" y="239" font-size="32">Found 3 bugs.</text>
  <text class="sans t-off" x="72" y="285" font-size="32">Want me to fix them?</text>
  <path class="b-on" d="M674 184H1218a22 22 0 0 1 22 22V295a22 22 0 0 1 -22 22H658a6 6 0 0 1 -6 -6V206a22 22 0 0 1 22 -22Z"/>
  <text class="sans t-on" x="684" y="239" font-size="32">Fixed all 3 bugs and checked</text>
  <text class="sans t-on" x="684" y="285" font-size="32">each one. All 24 tests pass.</text>
  <g><circle class="hot" cx="1199" cy="227.5" r="15"/><path class="tick" d="M1192.5 228l4.5 4.5l9 -10"/></g>

  <!-- Stops halfway -->
  <text class="sans ink" x="42" y="391" font-size="30" font-weight="700">Stops halfway</text>
  <path class="b-off" d="M62 413H606a22 22 0 0 1 22 22V524a22 22 0 0 1 -22 22H46a6 6 0 0 1 -6 -6V435a22 22 0 0 1 22 -22Z"/>
  <text class="sans t-off" x="72" y="468" font-size="32">Done with the first 2 screens.</text>
  <text class="sans t-off" x="72" y="514" font-size="32">Shall I continue with the rest?</text>
  <path class="b-on" d="M674 413H1218a22 22 0 0 1 22 22V524a22 22 0 0 1 -22 22H658a6 6 0 0 1 -6 -6V435a22 22 0 0 1 22 -22Z"/>
  <text class="sans t-on" x="684" y="468" font-size="32">Built all 5 screens and</text>
  <text class="sans t-on" x="684" y="514" font-size="32">clicked through each one.</text>
  <g><circle class="hot" cx="1199" cy="456.5" r="15"/><path class="tick" d="M1192.5 457l4.5 4.5l9 -10"/></g>

  <!-- Does the bare minimum -->
  <text class="sans ink" x="42" y="620" font-size="30" font-weight="700">Does the bare minimum</text>
  <path class="b-off" d="M62 642H606a22 22 0 0 1 22 22V799a22 22 0 0 1 -22 22H46a6 6 0 0 1 -6 -6V664a22 22 0 0 1 22 -22Z"/>
  <text class="sans t-off" x="72" y="743" font-size="32">Added the <tspan class="mono" font-size="30">--limit</tspan> flag.</text>
  <path class="b-on" d="M674 642H1218a22 22 0 0 1 22 22V799a22 22 0 0 1 -22 22H658a6 6 0 0 1 -6 -6V664a22 22 0 0 1 22 -22Z"/>
  <text class="sans t-on" x="684" y="697" font-size="32">Added <tspan class="mono" font-size="30">--limit</tspan> and refused</text>
  <text class="sans t-on" x="684" y="743" font-size="32">negative numbers. Updated the</text>
  <text class="sans t-on" x="684" y="789" font-size="32">help and README. Tested 0, 3, 50.</text>
  <g><circle class="hot" cx="1199" cy="685.5" r="15"/><path class="tick" d="M1192.5 686l4.5 4.5l9 -10"/></g>

  <!-- Ships the first draft -->
  <text class="sans ink" x="42" y="895" font-size="30" font-weight="700">Ships the first draft</text>
  <path class="b-off" d="M62 917H606a22 22 0 0 1 22 22V1074a22 22 0 0 1 -22 22H46a6 6 0 0 1 -6 -6V939a22 22 0 0 1 22 -22Z"/>
  <text class="sans t-off" x="72" y="1018" font-size="32">Here’s your landing page.</text>
  <path class="b-on" d="M674 917H1218a22 22 0 0 1 22 22V1074a22 22 0 0 1 -22 22H658a6 6 0 0 1 -6 -6V939a22 22 0 0 1 22 -22Z"/>
  <text class="sans t-on" x="684" y="972" font-size="32">Built it, reviewed it like a</text>
  <text class="sans t-on" x="684" y="1018" font-size="32">designer, and fixed the weakest</text>
  <text class="sans t-on" x="684" y="1064" font-size="32">parts in 2 more rounds.</text>
  <g><circle class="hot" cx="1199" cy="960.5" r="15"/><path class="tick" d="M1192.5 961l4.5 4.5l9 -10"/></g>

  <text class="sans muted" x="640" y="1154" font-size="26" text-anchor="middle">Example messages, for illustration</text>
</svg>
